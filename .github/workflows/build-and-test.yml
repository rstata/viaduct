name: Build and Test (Gradle)

env:
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}

on:
  workflow_dispatch:
    inputs:
      java_versions:
        description: "Java versions (array, e.g. [\"17\",\"21\"]). Defaults to [\"11\",\"17\",\"21\"]."
        required: false
        type: string
      os:
        description: "Operating system (e.g. [\"ubuntu-24.04-arm\", \"macos-15-intel\"]).  Defaults to [\"ubuntu-latest\", \"macos-latest\"]."
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate inputs
        env:
          OS_INPUT: ${{ inputs.os }}
          JAVA_INPUT: ${{ inputs.java_versions }}
        run: python3 .github/scripts/validate_inputs.py

  build:
    needs: validate-inputs
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","macos-latest"]') }}
        java: ${{ fromJSON(inputs.java_versions || '["11", "17", "21"]') }}
    runs-on: ${{ matrix.os }}
    name: Build (Java ${{ matrix.java }}) ${{ matrix.os }}
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}

      - name: Download dependencies
        run: |
          echo "📥 Downloading Gradle dependencies..."
          ./gradlew dependencies || {
            echo "❌ Failed to download dependencies"
            exit 1
          }
          echo "✅ Dependencies downloaded successfully"
        shell: bash

      # Pinned 3.13 due to incompatibility between djlint and 3.14
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build project (without tests)
        id: build_project
        run: |
          set -o pipefail

          echo "🔨 Building project..."
          ./gradlew clean || { echo "❌ Clean failed"; exit 1; }

          log_file="$(mktemp)"
          if ./gradlew assemble --scan 2>&1 | tee "$log_file"; then
            status=0
            echo "✅ Project built successfully"
          else
            status=$?
            echo "❌ Assemble failed"
          fi

          python3 .github/scripts/maybe_capture_build_scan_artifact.py \
            "$log_file" \
            build-assemble.txt \
            --status "$status"

          exit "$status"
        shell: bash

      - name: Verify Dokka output
        run: |
          echo "🔨 Building Dokka documentation..."
          cd docs
          mkdocs build
          cd ..

          echo "🔨 Building Dokka documentation..."
          ./gradlew :core:tenant:tenant-api:dokkaGenerate :core:service:dokkaGenerate :core:x:javaapi:javaapi-api:dokkaGenerate || { echo "❌ Dokka failed"; exit 1; }

          echo "📖 Verifying Dokka documentation output..."

          # Check tenant-api docs
          if [ ! -f "docs/site/apis/tenant-api/index.html" ]; then
            echo "❌ Missing tenant-api Dokka output: docs/site/apis/tenant-api/index.html"
            exit 1
          fi
          echo "✅ tenant-api docs present"

          # Check service aggregated docs
          if [ ! -f "docs/site/apis/service/index.html" ]; then
            echo "❌ Missing service Dokka output: docs/site/apis/service/index.html"
            exit 1
          fi
          echo "✅ service docs present"

          # Verify service docs contain aggregated modules
          if [ ! -d "docs/site/apis/service/service/service-api" ]; then
            echo "❌ Missing aggregated service-api module in service docs"
            exit 1
          fi
          if [ ! -d "docs/site/apis/service/service/service-wiring" ]; then
            echo "❌ Missing aggregated service-wiring module in service docs"
            exit 1
          fi
          echo "✅ service docs contain aggregated modules (service-api, service-wiring)"

          PYTHONPATH=docs:$PYTHONPATH djlint docs/site/ --lint \
            --ignore "H005,H006,H013,H014,H020,H021,H023,H025,H026,H030,H031" \
            --exclude "apis/" \
            --include "LINK001" || { echo "❌ Site contains broken links"; exit 1; }

          echo "✅ All Dokka documentation verified successfully"
        shell: bash

      - name: Collect build artifacts
        run: |
          echo "📦 Collecting artifacts..."
          rm -rf build/package
          mkdir -p build/package/{primary,sources,javadoc,others}

          # Primary jars (exclude sources/javadoc)
          find . -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            -exec cp {} build/package/primary/ \; || true

          # Sources & Javadoc jars (if any)
          find . -type f -path "*/build/libs/*-sources.jar" -exec cp {} build/package/sources/ \; || true
          find . -type f -path "*/build/libs/*-javadoc.jar" -exec cp {} build/package/javadoc/ \; || true

          # (Optional) POMs or other publish files
          find . -type f -path "*/build/publications/*/*.pom" -exec cp {} build/package/others/ \; || true

          echo "✅ Collected:"
          find build/package -type f -maxdepth 2 -print
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: build-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/

      - name: Upload build scan URLs
        if: ${{ always() && hashFiles('build-scan-urls/*.txt') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-build-${{ matrix.java }}-${{ matrix.os }}
          path: build-scan-urls/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","macos-latest"]') }}
        java: ${{ fromJSON(inputs.java_versions || '["11", "17", "21"]') }}
    name: Test (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - uses: actions/download-artifact@v7
        with:
          name: build-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/

      - name: Run tests
        id: run_tests
        run: |
          set -o pipefail

          echo "🧪 Running tests..."
          log_file="$(mktemp)"
          if ./gradlew test --scan --continue 2>&1 | tee "$log_file"; then
            status=0
          else
            status=$?
            echo "⚠️ Some tests failed, but continuing"
            echo "Test failures are not blocking the pipeline"
          fi

          python3 .github/scripts/maybe_capture_build_scan_artifact.py \
            "$log_file" \
            test.txt \
            --status "$status"

          echo "✅ Test execution completed"
          exit 0
        shell: bash

      - name: Generate coverage and test reports
        if: always()
        run: |
          echo "📊 Generating aggregated coverage and test reports..."
          ./gradlew testAndCoverage --no-configuration-cache || {
            echo "❌ Failed to generate reports"
            exit 1
          }
          echo "✅ Reports generated successfully"
        shell: bash

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results-java-${{ matrix.java }}-${{ matrix.os }}
          path: '**/build/test-results/test/*.xml'

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/reports/jacoco

      - name: Upload all reports (for debugging)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: all-reports-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/reports

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        if: always()
        run: pip install -r .github/scripts/requirements.txt

      - name: Running Python Script Tests
        if: always()
        run: |
          cd .github/scripts/tests
          python3 -m unittest discover
        shell: bash

      - name: Upload build scan URLs
        if: ${{ always() && hashFiles('build-scan-urls/*.txt') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-test-${{ matrix.java }}-${{ matrix.os }}
          path: build-scan-urls/

  detekt:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: detekt (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - name: Run Detekt Static Analysis
        id: run_detekt
        run: |
          set -o pipefail

          echo "🧹 Running Detekt static analysis..."

          log_file="$(mktemp)"
          if ./gradlew detekt --scan --no-daemon --max-workers=1 2>&1 | tee "$log_file"; then
            status=0
            echo "✅ Detekt analysis passed"
          else
            status=$?
            echo "❌ Detekt found code style violations"
          fi

          python3 .github/scripts/maybe_capture_build_scan_artifact.py \
            "$log_file" \
            detekt.txt \
            --status "$status"

          exit "$status"
        shell: bash

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports-java-${{ matrix.java }}-${{ matrix.os }}
          path: '**/build/reports/detekt/**/*'

      - name: Upload build scan URLs
        if: ${{ always() && hashFiles('build-scan-urls/*.txt') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-detekt-${{ matrix.java }}-${{ matrix.os }}
          path: build-scan-urls/

  ktlint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: ktlint (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - name: Run Ktlint Code Formatting Check
        id: run_ktlint
        run: |
          set -o pipefail

          echo "🧹 Running Ktlint code formatting check..."

          log_file="$(mktemp)"
          if ./gradlew ktlintCheck --scan --no-daemon --max-workers=1 2>&1 | tee "$log_file"; then
            status=0
            echo "✅ Ktlint formatting check passed"
          else
            status=$?
            echo "❌ Ktlint found code formatting violations"
          fi

          python3 .github/scripts/maybe_capture_build_scan_artifact.py \
            "$log_file" \
            ktlint.txt \
            --status "$status"

          exit "$status"
        shell: bash

      - name: Upload build scan URLs
        if: ${{ always() && hashFiles('build-scan-urls/*.txt') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-ktlint-${{ matrix.java }}-${{ matrix.os }}
          path: build-scan-urls/

  coverage-verification:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: coverage verification (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: test
    if: failure() || success()
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - name: Verify coverage thresholds
        id: verify_coverage
        run: |
          set -o pipefail

          echo "🎯 Verifying coverage thresholds..."

          log_file="$(mktemp)"
          if ./gradlew testCodeCoverageVerification --scan --no-configuration-cache -x testCodeCoverageReport 2>&1 | tee "$log_file"; then
            status=0
            echo "✅ Coverage thresholds met successfully"
          else
            status=$?
            echo "❌ Coverage thresholds not met"
            echo "Please check the coverage report and add more tests"
          fi

          python3 .github/scripts/maybe_capture_build_scan_artifact.py \
            "$log_file" \
            coverage-verification.txt \
            --status "$status"

          exit "$status"
        shell: bash

      - name: Upload build scan URLs
        if: ${{ always() && hashFiles('build-scan-urls/*.txt') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-coverage-${{ matrix.java }}-${{ matrix.os }}
          path: build-scan-urls/

  collect-failure-info:
    runs-on: ubuntu-latest
    needs: [build, test, detekt, ktlint, coverage-verification]
    if: failure()
    steps:
      - name: Collect failure metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=${{ github.run_id }}

          failed_jobs=$(gh api repos/${{ github.repository }}/actions/runs/$run_id/jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")')

          failed_steps=$(gh api repos/${{ github.repository }}/actions/runs/$run_id/jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .steps[] | select(.conclusion=="failure") | .name] | join(", ")')

          mkdir -p slack-alert
          cat > slack-alert/failure-info.json <<EOF
          {
            "workflow": "${{ github.workflow }}",
            "run_number": "${{ github.run_number }}",
            "repository": "${{ github.event.repository.name }}",
            "failed_jobs": "$failed_jobs",
            "failed_steps": "$failed_steps",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "sha": "${{ github.sha }}",
            "server_url": "${{ github.server_url }}",
            "repository_full": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF
        shell: bash

      - name: Upload failure info artifact
        uses: actions/upload-artifact@v6
        with:
          name: slack-alert
          path: slack-alert/
