name: Post Build Scan Comments

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build and Test workflow run ID to inspect"
        required: true
        type: string
  workflow_run:
    workflows: ["Build and Test (Gradle)"]
    types:
      - completed

concurrency:
  group: build-scan-comment-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  post-comment:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'failure'
      )
    steps:
      - uses: actions/checkout@v6

      - name: Download all build scan URL artifacts
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          pattern: build-scan-urls-*
          path: build-scan-urls
          merge-multiple: false

      - name: Collect scan URLs and post PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const {
              buildCommentBody,
              collectBuildScanData,
              findExistingComment,
            } = require('./.github/scripts/post_build_scan_comments');

            const baseDir = 'build-scan-urls';
            const {prNumber, scansByJob} = collectBuildScanData(baseDir);
            if (!prNumber) {
              console.log('No PR number found in artifacts, skipping comment');
              return;
            }

            console.log(`Found PR number: ${prNumber}`);
            if (scansByJob.size === 0) {
              console.log('No build scan URLs found in artifacts');
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`;
            const body = buildCommentBody({runUrl, scansByJob});
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existingComment = findExistingComment(comments);

            if (existingComment) {
              console.log(`Updating existing build scan comment ${existingComment.id}`);
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              return;
            }

            console.log('Creating new build scan comment');
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
